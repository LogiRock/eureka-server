spring:
  application:
    name: eureka-server
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8088}

# Valores locales por si el config-server no está disponible.
# Los definitivos vienen de eureka-server.yml en el repo de configuración.
server:
  port: ${PORT:8065}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false